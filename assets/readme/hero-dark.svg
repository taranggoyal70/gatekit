<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Gatekit: policy gates, human approvals and a tamper-evident audit chain for AI agent actions</title>
<desc id="desc">Animated replay of a recorded Gatekit run with the eval's 56-policy reference pack. email.send on maria@harbor-foods.example at low risk is allowed (Allow email.send); payment.refund on ch_3PZ81 at high risk is held for a human and then approved by finance-lead (Hold high-risk refunds); db.drop_table on prod.orders_legacy at critical risk is denied (Deny production table drops); deploy.rollback on api@prod at high risk is allowed (Allow deploy.rollback). Each decision is appended to a SHA-256 hash chain as events #57 to #61, and the chain verifies: 61 events.</desc>
